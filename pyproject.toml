[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-rl-flywheel"
version = "0.1.0"
description = "Harnessed Agentic Post-Training with Zero Retokenization Drift, Cross-Family Prefix OPD, DAPO, and RAGEN-2 Collapse Diagnostics"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "torch>=2.3.0",
    "sympy>=1.12",
    "numpy>=1.26.0",
    "openai>=1.50.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train4070 = [
    "transformers>=4.51.0",
    "peft>=0.14.0",
    "bitsandbytes>=0.45.0",
    "accelerate>=1.3.0",
    "datasets>=3.0.0",
    "sentence-transformers>=3.3.0",
    "wandb>=0.19.0",
]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
